name: Build & Release SingStudio (EXE & APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================================================
  # 1. 編譯 Windows 原生桌面執行檔 (Electron)
  # ==========================================================================
  build-windows:
    name: Build Windows Standalone EXE & Setup
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: singstudio-react/package-lock.json

      - name: Install Dependencies
        working-directory: singstudio-react
        run: npm ci

      - name: Build Windows Standalone & Installer (electron-builder)
        working-directory: singstudio-react
        run: npm run electron:build -- --publish never

      - name: Upload Windows Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SingStudio-Windows-x64
          path: singstudio-react/release/SingStudio-Windows-x64.exe

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SingStudio-Windows-Setup
          path: singstudio-react/release/SingStudio-Setup-*.exe

  # ==========================================================================
  # 2. 編譯 Android 安裝套件 (.apk)
  # ==========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build React Web App
        working-directory: singstudio-react
        run: |
          npm ci
          npm run build:web

      - name: Prepare Web Assets for Capacitor
        run: |
          rm -rf www
          mkdir -p www
          cp -r singstudio-react/dist/* www/
          cp -r singstudio-react/public/assets www/ 2>/dev/null || true

      - name: Initialize Capacitor Android Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init SingStudio com.singstudio.app --web-dir www
          npx cap add android

      - name: Configure Android App Icon and Permissions
        run: |
          # 替換 Android 應用程式啟動圖示
          find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp singstudio-react/public/assets/icon.png {} \; 2>/dev/null || true

          # 加入麥克風錄音與音訊設定權限 (Capacitor 已內建 INTERNET 權限，避免重複宣告警告)
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml
          npx cap sync android

          # 解決 Kotlin stdlib-jdk7 / stdlib-jdk8 與 kotlin-stdlib 重複類別衝突 (AGP checkDebugDuplicateClasses)
          python3 scripts/patch_android_build.py

      - name: Build Android Release APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../SingStudio-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SingStudio-Android-APK
          path: SingStudio-Android.apk

  # ==========================================================================
  # 3. 發布 GitHub Release 並附帶下載資產
  # ==========================================================================
  release:
    name: Publish GitHub Release Assets
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Standalone EXE
        uses: actions/download-artifact@v4
        with:
          name: SingStudio-Windows-x64
          path: .

      - name: Download Windows Setup EXE
        uses: actions/download-artifact@v4
        with:
          name: SingStudio-Windows-Setup
          path: .

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: SingStudio-Android-APK
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: SingStudio Release ${{ github.ref_name }}
          overwrite: true
          body: |
            ### 🎵 SingStudio ${{ github.ref_name }} 自動編譯發佈
            
            本版本由 GitHub Actions 自動建置發布，包含：
            - **Windows 免安裝執行檔**：`SingStudio-Windows-x64.exe`（原生 Electron 桌面應用，直接雙擊即可啟動，無需瀏覽器）
            - **Windows 安裝程式**：`SingStudio-Setup-*.exe`（標準安裝導引程式，自動建立桌面與開始功能表捷徑）
            - **Android 安裝套件**：`SingStudio-Android.apk`（安裝於手機平板隨身練唱，已內建麥克風錄音權限與正式簽名）

            #### 亮點功能：
            - 原生 React 19 + TypeScript + Electron 桌面視窗體驗（取代舊版 Python HTTP Server）
            - YouTube 免費直連搜尋與 25 FPS 時間軸雙向連動
            - 空白鍵快速播放/暫停快捷鍵
            - 支援接續錄製 (Punch-in)、多段 Takes 單獨重錄與防覆蓋機制
            - 時間軸磁鐵吸附 (Magnetic Snap) 與 Shift+滾輪自由水平平移
            - 動態字幕起點平移校準 (Offset) 與平滑居中捲動
          files: |
            SingStudio-Windows-x64.exe
            SingStudio-Setup-*.exe
            SingStudio-Android.apk
